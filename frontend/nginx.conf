# Preserve the scheme the *viewer* used.
#
# nginx only ever listens on plain 80 here, so $scheme is always "http". Behind
# CloudFront the viewer arrived over TLS and the edge says so in
# X-Forwarded-Proto -- blindly sending $scheme would overwrite that, and Django
# (SECURE_PROXY_SSL_HEADER) would conclude the request was insecure and build
# http:// URLs for an https:// page. Trust the incoming header when there is
# one, fall back to $scheme when the instance is hit directly.
map $http_x_forwarded_proto $forwarded_proto {
    default        $scheme;
    "~^[a-z]+$"    $http_x_forwarded_proto;
}

# Flower's dashboard polls over a websocket; without this, Connection stays
# "close" and every browser tab falls back to (working but noisier) polling.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Hide the version from Server: headers.
    server_tokens off;

    client_max_body_size 8m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker's embedded DNS. Needed by the runtime resolution below; the short
    # validity keeps a recycled container's new address from lingering.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- API -------------------------------------------------------------- #
    # Long read timeout: submits return in milliseconds, but a result page over a
    # large Parquet file can take a moment on a small instance.
    location /api/ {
        # The hostname goes through a variable on purpose. With a literal
        # `proxy_pass http://backend:8000`, nginx resolves the name once at
        # startup and caches the address for its whole life -- so every redeploy
        # that recreates the backend container leaves nginx dialling a dead IP
        # and serving 502s until it happens to be restarted too. A variable
        # forces re-resolution per request against the resolver above.
        set $api_upstream "backend:8000";
        proxy_pass         http://$api_upstream;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
        proxy_redirect     off;
    }

    # ---- flower ------------------------------------------------------------ #
    # Flower also listens directly on :5555 (see docker-compose.prod.yml), but
    # CloudFront only ever forwards 80/443, so this path is what lets the CDN
    # domain reach it too. Flower is started with --url-prefix=flower, so it
    # already expects requests to arrive with this prefix intact -- hence no
    # trailing path on proxy_pass here, same as the /api/ block above.
    location /flower/ {
        set $flower_upstream "flower:5555";
        proxy_pass         http://$flower_upstream;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_redirect     off;
    }

    # ---- static assets ---------------------------------------------------- #
    # Vite emits content-hashed filenames, so these are safe to cache hard.
    location /assets/ {
        root      /usr/share/nginx/html;
        expires   1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- app -------------------------------------------------------------- #
    location / {
        root      /usr/share/nginx/html;
        index     index.html;
        try_files $uri $uri/ /index.html;
    }
}
